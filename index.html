<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1218">
  <meta name="robots" content="noindex, nofollow">
  <title>PNB Digital</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1218;
      --panel: #141b24;
      --panel-soft: #18212c;
      --text: #f4f7f8;
      --muted: #a8b3bd;
      --line: #293544;
      --accent: #8fb8ff;
      --success: #66d38f;
      --success-bg: #133223;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(143, 184, 255, 0.12), transparent 34%),
        linear-gradient(145deg, #0d1218 0%, #111923 52%, #0b0f15 100%);
    }

    main {
      width: min(100%, 720px);
    }

    .shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(24, 33, 44, 0.96), rgba(17, 24, 33, 0.96));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), transparent);
    }

    .content {
      position: relative;
      padding: clamp(28px, 6vw, 56px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: clamp(40px, 8vw, 72px);
    }

    .brand-mark {
      display: inline-grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid #344357;
      border-radius: 12px;
      background: var(--panel-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 6px 11px;
      border: 1px solid rgba(102, 211, 143, 0.34);
      border-radius: 999px;
      background: var(--success-bg);
      color: #d7f8e2;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(102, 211, 143, 0.12);
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-size: clamp(44px, 9vw, 82px);
      line-height: 0.95;
      letter-spacing: -0.035em;
    }

    .tagline {
      margin: 20px 0 0;
      color: #d4dce4;
      font-size: clamp(17px, 2.3vw, 22px);
      line-height: 1.45;
    }

    .notice {
      max-width: 58ch;
      margin: clamp(34px, 7vw, 58px) 0 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: clamp(38px, 7vw, 64px);
      color: #788692;
      font-size: 12px;
    }

    ::selection {
      background: rgba(143, 184, 255, 0.28);
      color: var(--text);
    }

    @media (max-width: 560px) {
      body {
        padding: 18px;
      }

      .brand-row,
      footer {
        align-items: flex-start;
        flex-direction: column;
      }

      h1 {
        max-width: 9ch;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <section class="shell" aria-label="PNB Digital private environment">
      <div class="content">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">PNB</div>
          <div class="badge">Secure Sandbox - Active</div>
        </div>

        <h1 id="page-title">PNB Digital</h1>
        <p class="tagline">Client Review &amp; Validation Environment</p>

        <p class="notice">
          This private review environment is reserved for authorized project validation.
          Access requires a direct project URL provided by PNB Digital.
        </p>

        <footer>
          <span>&copy; 2026 PNB Digital. All rights reserved.</span>
          <span>Confidential review workspace</span>
        </footer>
      </div>
    </section>
  </main>
</body>
</html>
